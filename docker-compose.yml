services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wa_automation
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  web:
    build: .
    env_file: .env.local
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/wa_automation
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  # Drains the outbox. Scale with `docker compose up --scale worker=3` —
  # claims use FOR UPDATE SKIP LOCKED, so workers never collide.
  worker:
    build: .
    command: ["npm", "run", "worker"]
    env_file: .env.local
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/wa_automation
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
